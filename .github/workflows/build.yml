name: Build SSLBypass dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app | tail -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Build full arm64 dylib (fishhook + SecTrust)
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK_PATH"
          clang -arch arm64 -dynamiclib -o SSLBypass_full.dylib SSLBypass/SSLBypass_standalone.m \
            -framework Foundation -framework Security -framework CoreFoundation \
            -miphoneos-version-min=14.0 \
            -isysroot "$SDK_PATH"
          ls -lh SSLBypass_full.dylib
          file SSLBypass_full.dylib

      - name: Build light arm64 dylib (NSURLSession only)
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK_PATH"
          clang -arch arm64 -dynamiclib -o SSLBypass_light.dylib SSLBypass/SSLBypass_nofishhook.m \
            -framework Foundation \
            -miphoneos-version-min=14.0 \
            -isysroot "$SDK_PATH"
          ls -lh SSLBypass_light.dylib
          file SSLBypass_light.dylib

      - name: Upload full artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSLBypass_full.dylib
          path: SSLBypass_full.dylib

      - name: Upload light artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSLBypass_light.dylib
          path: SSLBypass_light.dylib
